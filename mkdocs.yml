site_name: SAS Company
site_description: Демонстрационный проект технической документации
site_url: https://slavakult.github.io/engineering-docs/

repo_url: https://github.com/slavakult/engineering-docs
repo_name: SAS Company

edit_uri: edit/main/docs/

nav:
  - Главная: index.md

  - Начало работы:
      - Обзор системы: getting-started/overview.md
      - Архитектура: getting-started/architecture.md
      - Быстрый старт: getting-started/quick-start.md
      - Авторизация: getting-started/authorization.md

  - Руководство пользователя:
      - Обзор: user-guide/index.md
      - Панель управления: user-guide/dashboard.md
      - Склад: user-guide/warehouse.md
      - Библиотека: user-guide/library.md
      - Дефицит: user-guide/deficit.md
      - Проекты: user-guide/projects.md
      - Repo: user-guide/repository.md
      - Задачи: user-guide/tasks.md
      - Доски: user-guide/boards.md
      - Команда: user-guide/team.md

  - API Reference: api-reference/index.md

  - Справочник:
      - Обзор: reference/index.md
      - Часто задаваемые вопросы: reference/faq.md
      - Глоссарий: reference/glossary.md
      - История изменений: reference/changelog.md

  - Проект: about/index.md

theme:
  name: material
  logo: images/logo.png
  language: ru

  features:
    - navigation.path
    - navigation.footer
    - toc.integrate
    - content.code.copy
    - content.code.select
    - content.action.view

  icon:
    repo: fontawesome/brands/github
    edit: material/pencil-plus
    view: material/file-code

  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: light blue
      toggle:
        icon: material/brightness-7
        name: Тёмная тема

    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: light blue
      toggle:
        icon: material/brightness-4
        name: Светлая тема

extra:
  generator: false

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/extra.js
  
plugins:
  - search

  - i18n:
      docs_structure: suffix
      fallback_to_default: false
      reconfigure_material: true
      reconfigure_search: true

      languages:
        - locale: ru
          name: Русский
          default: true
          build: true

        - locale: en
          name: English
          build: true
          nav_translations:
            Главная: Home
            Начало работы: Getting started
            Обзор системы: System overview
            Архитектура: Architecture
            Быстрый старт: Quick start
            Авторизация: Authorization
            Руководство пользователя: User guide
            Обзор: Overview
            Панель управления: Dashboard
            Склад: Warehouse
            Библиотека: Library
            Дефицит: Deficit
            Проекты: Projects
            Задачи: Tasks
            Доски: Boards
            Команда: Team
            Часто задаваемые вопросы: FAQ
            Глоссарий: Glossary
            История изменений: Changelog
            Проект: Project

  - swagger-ui-tag:
      supportedSubmitMethods: []

  - zen-mode:
      enabled: true
      max_width: "900px"
      shortcut: "Alt+Z"
      button_position: header
      hide_header: true
      hide_footer: true
      hide_tabs: true
      hide_toc: true
      hide_nav: true
      hide_announce: true
      transition_duration: "0.3s"

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables

  - toc:
      permalink: true
      separator: "_"

  - pymdownx.details

  - pymdownx.tabbed:
      alternate_style: true

  - pymdownx.tasklist:
      custom_checkbox: true

  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg