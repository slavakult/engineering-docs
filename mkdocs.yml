site_name: Engineering Portal Documentation

theme:
  name: material
  language: ru

plugins:
  - search
  - mermaid2

markdown_extensions:
  - admonition
  - tables
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.superfences

nav:
  - Главная: index.md
  - Начало работы:
      - Обзор системы: getting-started/overview.md
      - Архитектура: getting-started/architecture.md
      - Быстрый старт: getting-started/quick-start.md
      - Авторизация: getting-started/authorization.md