<!DOCTYPE html>
<html lang="ru" data-theme="light">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Исходный код Markdown</title>

    <style>

        /* ==================================================
           Цветовые переменные
           ================================================== */

        :root {
            color-scheme: light;

            --bg: #f5f6f8;
            --surface: #ffffff;
            --text: #24292f;
            --muted: #656d76;
            --border: #d8dee4;

            --button-bg: #ffffff;
            --button-hover: #f3f4f6;

            --accent: #0969da;
            --code-bg: #ffffff;
            --success: #238636;
            --error: #cf222e;
        }


        /* ==================================================
           Тёмная тема
           ================================================== */

        [data-theme="dark"] {
            color-scheme: dark;

            --bg: #0d1117;
            --surface: #161b22;
            --text: #e6edf3;
            --muted: #8b949e;
            --border: #30363d;

            --button-bg: #21262d;
            --button-hover: #30363d;

            --accent: #58a6ff;
            --code-bg: #0d1117;
            --success: #238636;
            --error: #f85149;
        }


        /* ==================================================
           Общие стили
           ================================================== */

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;

            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                sans-serif;

            background: var(--bg);
            color: var(--text);

            min-height: 100vh;
        }


        /* ==================================================
           Верхняя панель
           ================================================== */

        header {
            display: flex;
            align-items: center;
            justify-content: space-between;

            gap: 16px;
            flex-wrap: wrap;

            padding: 16px 24px;

            background: var(--surface);
            border-bottom: 1px solid var(--border);
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 16px;
            flex-wrap: wrap;
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }


        /* ==================================================
           Кнопки
           ================================================== */

        button,
        .button {
            display: inline-flex;
            align-items: center;
            justify-content: center;

            gap: 8px;

            padding: 9px 14px;

            border: 1px solid var(--border);
            border-radius: 6px;

            background: var(--button-bg);
            color: var(--text);

            font-size: 14px;
            text-decoration: none;

            cursor: pointer;

            transition:
                background 0.15s ease,
                border-color 0.15s ease;
        }

        button:hover,
        .button:hover {
            background: var(--button-hover);
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .primary-button {
            color: #ffffff;
            background: var(--accent);
            border-color: var(--accent);
        }

        .primary-button:hover {
            opacity: 0.9;
            background: var(--accent);
        }


        /* ==================================================
           Основная область
           ================================================== */

        main {
            width: 100%;
            max-width: 1500px;

            margin: 0 auto;
            padding: 24px;
        }

        .page-title {
            margin: 0 0 8px;

            font-size: 24px;
            font-weight: 600;
        }

        .file-path {
            margin-bottom: 20px;

            color: var(--muted);
            font-size: 14px;

            word-break: break-all;
        }


        /* ==================================================
           Панель кода
           ================================================== */

        .code-wrapper {
            overflow: auto;

            background: var(--code-bg);
            border: 1px solid var(--border);
            border-radius: 8px;
        }

        pre {
            margin: 0;
            padding: 16px 0;

            font-family:
                "SFMono-Regular",
                Consolas,
                "Liberation Mono",
                monospace;

            font-size: 14px;
            line-height: 1.6;

            white-space: pre;
            tab-size: 4;
        }


        /* ==================================================
           Строки
           ================================================== */

        .line {
            display: flex;
            min-width: max-content;
        }

        .line-number {
            flex: 0 0 60px;

            padding: 0 16px;

            text-align: right;
            user-select: none;

            color: var(--muted);
            border-right: 1px solid var(--border);
        }

        .line-content {
            padding-left: 16px;
            padding-right: 24px;

            white-space: pre;
        }


        /* ==================================================
           Статус загрузки
           ================================================== */

        #status {
            margin: 16px 0;

            font-size: 14px;
            color: var(--muted);
        }

        #status.error {
            color: var(--error);
        }

        #status.success {
            color: var(--success);
        }


        /* ==================================================
           Нижняя часть
           ================================================== */

        footer {
            margin-top: 24px;
            padding: 16px 0;

            text-align: center;

            color: var(--muted);
            font-size: 13px;
        }


        /* ==================================================
           Мобильная адаптация
           ================================================== */

        @media (max-width: 600px) {

            header {
                padding: 12px 16px;
            }

            main {
                padding: 16px;
            }

            .page-title {
                font-size: 21px;
            }

            button,
            .button {
                padding: 8px 10px;
                font-size: 13px;
            }

            pre {
                font-size: 12px;
            }

            .line-number {
                flex-basis: 45px;
                padding: 0 10px;
            }

            .line-content {
                padding-left: 12px;
            }
        }

    </style>
</head>


<body>

    <!-- ====================================================
         Верхняя панель
         ==================================================== -->

    <header>

        <div class="header-left">

            <a
                id="back-link"
                class="button"
                href="./"
            >
                ← Вернуться к документации
            </a>

            <span id="page-title">
                Исходный код Markdown
            </span>

        </div>


        <div class="header-right">

            <button
                id="theme-toggle"
                class="button"
                type="button"
                aria-label="Переключить тему"
                title="Переключить тему"
            >
                <span id="theme-icon">🌙</span>
            </button>

            <a
                id="github-link"
                class="button"
                href="#"
                target="_blank"
                rel="noopener noreferrer"
            >
                Открыть файл на GitHub ↗
            </a>

        </div>

    </header>


    <!-- ====================================================
         Основной контент
         ==================================================== -->

    <main>

        <h1 class="page-title" id="title">
            Исходный код Markdown
        </h1>

        <div
            class="file-path"
            id="file-path"
        ></div>


        <div class="header-right">

            <button
                id="copy-button"
                class="primary-button"
                type="button"
            >
                Копировать Markdown
            </button>

        </div>


        <div id="status">
            Загрузка исходного кода...
        </div>


        <div class="code-wrapper">

            <pre><code id="code"></code></pre>

        </div>


        <footer id="footer">
            Исходный код документации
        </footer>

    </main>


    <!-- ====================================================
         JavaScript
         ==================================================== -->

    <script src="javascripts/source-view.js"></script>

</body>

</html>
